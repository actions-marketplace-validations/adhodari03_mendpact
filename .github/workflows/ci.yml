name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest --cov=mendpact --cov-report=term-missing
      - name: Offline real-world validation setup smoke test
        run: |
          python scripts/prepare_validation.py ci-setup-only
          git check-ignore reports/validation/ci-setup-only/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          workspace = Path("reports/validation/ci-setup-only")
          manifest = json.loads((workspace / "manifest.json").read_text())
          authorization = json.loads((workspace / "authorization.json").read_text())
          assert manifest["status"] == "not-run"
          assert manifest["environment"]["working_tree_dirty"] is False
          assert authorization["status"] == "draft"
          assert authorization["max_discovery_scans"] == 2
          assert authorization["allow_authenticated"] is False
          assert authorization["allow_tool_execution"] is False
          assert authorization["allow_provider_calls"] is False
          assert not list(workspace.glob("scan*.json"))
          PY
      - name: Offline evidence export smoke test
        run: |
          mkdir -p reports
          mendpact export-report examples/contracts/candidate-scan.json \
            --output reports/scan-evidence.html
          mendpact export-report examples/model-comparison/reference-behavior.json \
            --format json --output reports/behavior-evidence.json
      - name: Offline scan recheck Action smoke test
        id: mendpact-recheck
        uses: ./
        with:
          mode: recheck
          source-report: examples/contracts/candidate-scan.json
          policy: examples/policies/local-reliability.toml
          output: rechecked-scan-report.json
      - name: Verify offline scan recheck provenance
        shell: bash
        env:
          MENDPACT_REPORT: ${{ steps.mendpact-recheck.outputs.report }}
          MENDPACT_MODE: ${{ steps.mendpact-recheck.outputs.mode }}
        run: |
          test "${MENDPACT_REPORT}" = "rechecked-scan-report.json"
          test "${MENDPACT_MODE}" = "recheck"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path("examples/contracts/candidate-scan.json")
          report = json.loads(Path("rechecked-scan-report.json").read_text())
          assert report["schema_version"] == "mendpact.scan.v1"
          assert report["status"] == "passed"
          assert report["recheck"]["source_sha256"] == hashlib.sha256(
              source.read_bytes()
          ).hexdigest()
          assert report["recheck"]["authorization_refreshed"] is False
          delta = report["recheck"]["rule_delta"]
          assert delta["schema_version"] == "mendpact.scan-rule-delta.v1"
          assert delta["introduced_count"] == 0
          assert delta["resolved_count"] == 0
          assert delta["reclassified_count"] == 0
          assert delta["unchanged_count"] == 0
          PY
      - name: Offline local history smoke test
        run: |
          mendpact history add examples/contracts/baseline-scan.json
          mendpact history add examples/contracts/candidate-scan.json
          mendpact history add examples/contracts/baseline-scan.json
          mendpact history list
          mendpact history compare 1 2 --output reports/history-comparison.json
          mendpact history prune
          python - <<'PY'
          import json
          from pathlib import Path
          from mendpact.history import list_history

          entries = list_history(Path("reports/history.sqlite"))
          assert len(entries) == 2
          report = json.loads(Path("reports/history-comparison.json").read_text())
          assert report["schema_version"] == "mendpact.history-comparison.v1"
          assert report["stages"][0]["comparable"] is True
          assert "target" not in report and "context" not in report
          PY
      - name: Prepare and inspect a fixture sharing package without approval
        run: |
          mendpact share prepare examples/contracts/candidate-scan.json \
            --output reports/fixture-sharing-package.zip
          mendpact share inspect reports/fixture-sharing-package.zip
          python - <<'PY'
          from pathlib import Path
          from mendpact.sharing import inspect_package

          package = inspect_package(Path("reports/fixture-sharing-package.zip"))
          assert package.summary.recorded_status == "passed"
          assert package.summary.source_schema == "mendpact.scan.v1"
          PY
      - name: MCP contract diff smoke test
        run: >-
          mendpact diff
          examples/contracts/baseline-scan.json
          examples/contracts/candidate-scan.json
          --scenario examples/scenarios/read-status.json
          --output contract-diff-report.json
      - name: Offline model comparison Action smoke test
        id: mendpact-model-comparison
        uses: ./
        with:
          mode: compare-models
          reference-report: examples/model-comparison/reference-behavior.json
          candidate-report: examples/model-comparison/candidate-behavior.json
          policy: examples/policies/local-reliability.toml
          output: model-comparison-report.json
      - name: Verify model comparison Action outputs
        shell: bash
        env:
          MENDPACT_REPORT: ${{ steps.mendpact-model-comparison.outputs.report }}
          MENDPACT_MODE: ${{ steps.mendpact-model-comparison.outputs.mode }}
        run: |
          test "${MENDPACT_REPORT}" = "model-comparison-report.json"
          test "${MENDPACT_MODE}" = "compare-models"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("model-comparison-report.json").read_text(encoding="utf-8")
          )
          assert report["schema_version"] == "mendpact.model-comparison.v1"
          assert report["status"] == "passed"
          assert report["reference"]["model"] == "fixture-reference-v1"
          assert report["candidates"][0]["model"] == "fixture-candidate-v2"
          assert report["policy"]["schema_version"] == "mendpact.policy.v2"
          PY
      - name: Offline semantic calibration Action smoke test
        id: mendpact-semantic-calibration
        uses: ./
        with:
          mode: calibrate-grader
          semantic-labels: examples/calibration/semantic-labels.example.json
          policy: examples/policies/local-reliability.toml
          output: semantic-calibration-report.json
      - name: Verify semantic calibration Action outputs
        shell: bash
        env:
          MENDPACT_REPORT: ${{ steps.mendpact-semantic-calibration.outputs.report }}
          MENDPACT_MODE: ${{ steps.mendpact-semantic-calibration.outputs.mode }}
        run: |
          test "${MENDPACT_REPORT}" = "semantic-calibration-report.json"
          test "${MENDPACT_MODE}" = "calibrate-grader"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("semantic-calibration-report.json").read_text(encoding="utf-8")
          )
          assert report["schema_version"] == "mendpact.semantic-calibration.v1"
          assert report["status"] == "passed"
          assert report["selected_threshold"] == 0.82
          assert report["validation"]["false_accepts"] == 0
          assert report["source_policy"]["schema_version"] == "mendpact.policy.v2"
          PY
      - name: Start MCP fixture
        run: |
          python -m uvicorn examples.fixture_server:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/mendpact-fixture.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:8000/mcp; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/mendpact-fixture.log
          exit 1
      - name: Behavioral replay smoke test
        run: >-
          mendpact evaluate
          http://127.0.0.1:8000/mcp
          --scenario examples/scenarios/read-status.json
          --replay examples/replays/openai-read-status-casefold.json
          --baseline examples/baselines/read-status.json
          --allow-private
          --allow-insecure-http
          --output behavior-report.json
      - name: Unified MCP guard Action smoke test
        id: mendpact-guard
        uses: ./
        with:
          mode: guard
          target: http://127.0.0.1:8000/mcp
          baseline: examples/guard/baseline-scan.json
          scenario: examples/scenarios/read-status.json
          replay: examples/replays/read-status.json
          policy: examples/policies/local-smoke.toml
          output: guard-report.json
      - name: Verify MendPact Action outputs
        shell: bash
        env:
          MENDPACT_REPORT: ${{ steps.mendpact-guard.outputs.report }}
          MENDPACT_MODE: ${{ steps.mendpact-guard.outputs.mode }}
        run: |
          test "${MENDPACT_REPORT}" = "guard-report.json"
          test "${MENDPACT_MODE}" = "guard"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("guard-report.json").read_text(encoding="utf-8"))
          assert report["policy"]["name"] == "local-smoke-fixture"
          assert report["policy"]["profile"] == "local"
          PY
      - name: Verify strict policy blocks risky fixture
        shell: bash
        run: |
          set +e
          mendpact guard http://127.0.0.1:8000/mcp \
            --baseline examples/guard/baseline-scan.json \
            --scenario examples/scenarios/read-status.json \
            --replay examples/replays/read-status.json \
            --policy examples/policies/local-strict.toml \
            --output strict-policy-report.json
          exit_code=$?
          set -e

          test "${exit_code}" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("strict-policy-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "failed"
          assert report["policy"]["scan_fail_on"] == "high"
          assert report["policy"]["contract_fail_on"] == "risky"
          assert report["summary"]["scan_status"] == "failed"
          assert report["summary"]["contract_status"] == "failed"
          assert report["summary"]["behavior_status"] == "passed"
          PY
      - name: Export failed guard evidence without changing its verdict
        run: |
          mendpact export-report strict-policy-report.json \
            --output reports/failed-guard-evidence.html
          mendpact export-report strict-policy-report.json \
            --format json --output reports/failed-guard-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/failed-guard-evidence.json").read_text())
          assert report["schema_version"] == "mendpact.evidence.v2"
          assert report["recorded_status"] == "failed"
          assert "target" not in report
          assert report["sections"][0]["metrics"]["Fails on severity"] == "high"
          PY
      - name: Verify controlled waivers are visible and time bounded
        shell: bash
        env:
          WAIVER_POLICY: ${{ runner.temp }}/mendpact-waiver.toml
        run: |
          python - <<'PY'
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          approved = datetime.now(UTC).date()
          expires = approved + timedelta(days=14)
          Path(os.environ["WAIVER_POLICY"]).write_text(
              f'''schema_version = "mendpact.policy.v1"
          name = "local-waiver-fixture"
          profile = "local"
          scan_fail_on = "high"
          contract_fail_on = "risky"
          allow_private = true
          allow_insecure_http = true

          [[waivers]]
          rule_id = "MP-MCP-004"
          subject = "tool:delete_project"
          reason = "Temporary exception for the isolated CI fixture."
          approved_by = "mendpact-ci"
          approved_on = {approved.isoformat()}
          expires_on = {expires.isoformat()}

          [[waivers]]
          rule_id = "MP-DIFF-003"
          subject = "tool:read_status"
          reason = "Temporary exception for the isolated CI fixture."
          approved_by = "mendpact-ci"
          approved_on = {approved.isoformat()}
          expires_on = {expires.isoformat()}
          ''',
              encoding="utf-8",
          )
          PY

          mendpact guard http://127.0.0.1:8000/mcp \
            --baseline examples/guard/baseline-scan.json \
            --scenario examples/scenarios/read-status.json \
            --replay examples/replays/read-status.json \
            --policy "${WAIVER_POLICY}" \
            --output waiver-policy-report.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("waiver-policy-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "passed"
          assert len(report["policy"]["waivers"]) == 2
          assert all(item["status"] == "active" for item in report["policy"]["waivers"])
          assert report["scan"]["summary"]["waived_finding_count"] == 1
          assert report["contract_diff"]["summary"]["waived_change_count"] == 1
          assert report["scan"]["findings"][0]["waiver"] is not None
          assert report["contract_diff"]["changes"][0]["waiver"] is not None
          PY
      - name: MCP conformance smoke test
        run: >-
          mendpact conformance
          http://127.0.0.1:8000/mcp
          --allow-private
          --allow-insecure-http
          --output conformance-report.json
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mendpact-conformance-report
          path: conformance-report.json
          if-no-files-found: ignore
      - name: Upload contract diff report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mendpact-contract-diff-report
          path: contract-diff-report.json
          if-no-files-found: ignore
      - name: Upload model comparison report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mendpact-model-comparison-report
          path: model-comparison-report.json
          if-no-files-found: ignore
      - name: Upload semantic calibration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mendpact-semantic-calibration-report
          path: semantic-calibration-report.json
          if-no-files-found: ignore
      - name: Upload guard report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mendpact-guard-report
          path: guard-report.json
          if-no-files-found: ignore
      - name: Upload fixture evidence summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mendpact-fixture-evidence
          path: |
            reports/scan-evidence.html
            reports/behavior-evidence.json
            reports/failed-guard-evidence.html
            reports/failed-guard-evidence.json
            reports/history-comparison.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload strict policy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mendpact-strict-policy-report
          path: strict-policy-report.json
          if-no-files-found: ignore
      - name: Upload waiver policy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mendpact-waiver-policy-report
          path: waiver-policy-report.json
          if-no-files-found: ignore
